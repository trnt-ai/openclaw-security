# Daily Dependabot PR sweeper — Dependency Security Program.
#
# TEMPLATE-STAMPED FILE: the canonical copy lives in the org's posture tooling
# (github-security-posture-manager skill, templates/). Repos carry identical
# copies; the posture report flags drift. Improve the template, then re-stamp.
#
# The auto-merge gate handles the moment a PR is opened/updated; this sweeper
# handles everything that goes wrong *afterwards*, so no bot PR idles silently:
#
#   - CONFLICTING PR → comment `@dependabot recreate`. Dependabot can reliably
#     fix its own conflicts by regenerating the branch, but its self-heal has
#     no SLA (and stops entirely after 30 days of inactivity); this bounds the
#     window at one sweep interval. Skips if a recreate/rebase command was
#     already posted in the last 20h, to avoid stacking commands.
#
#   - PR with failing checks, or not armed for auto-merge (ineligible: majors,
#     provenance failures — anything Dependabot cannot fix on its own) →
#     request review from the maintainer team, putting it in a human queue.
#     Idempotent: skips PRs where the team review is already requested.
#
# The team must have at least Triage access to the repo or GitHub rejects the
# review request (logged as a warning, never fails the run).
name: Dependabot sweeper

on:
  schedule:
    # Weekdays 14:07 UTC — ~7am LA / ~3pm UK in summer (cron is UTC-fixed;
    # local times drift with DST). Off-the-hour minute avoids GitHub's
    # top-of-hour scheduler congestion.
    - cron: "7 14 * * 1-5"
  workflow_dispatch: {}

permissions: {}

env:
  REVIEW_TEAM: dependency-maintainers

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.DEPENDABOT_AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.DEPENDABOT_AUTOMERGE_APP_KEY }}

      - name: Mint org-scoped token (team review requests only)
        id: org-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.DEPENDABOT_AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.DEPENDABOT_AUTOMERGE_APP_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Sweep open Dependabot PRs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_ROUTE_TOKEN: ${{ steps.org-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          gh pr list -R "$REPO" --author "app/dependabot" --state open \
            --json number,mergeable,autoMergeRequest,reviewRequests,headRefOid > prs.json
          echo "open dependabot PRs: $(jq length prs.json)"
          FAILURES=0

          for n in $(jq -r '.[].number' prs.json); do
            pr=$(jq -c ".[] | select(.number == $n)" prs.json)
            mergeable=$(jq -r '.mergeable' <<<"$pr")
            armed=$(jq -r '.autoMergeRequest != null' <<<"$pr")
            sha=$(jq -r '.headRefOid' <<<"$pr")
            failing=$(gh api "repos/$REPO/commits/$sha/check-runs?per_page=100" \
              --jq '[.check_runs[].conclusion] | any(. == "failure" or . == "timed_out" or . == "startup_failure")' 2>/dev/null || { echo "unknown"; })
            if [ "$failing" = "unknown" ]; then
              echo "::error::#$n: could not read check states — counting as sweep failure"
              FAILURES=$((FAILURES+1))
            fi
            requested=$(jq -r --arg t "$REVIEW_TEAM" '[.reviewRequests[]? | (.name // .slug // "")] | any(. == $t)' <<<"$pr")

            if [ "$mergeable" = "CONFLICTING" ]; then
              recent=$(gh api "repos/$REPO/issues/$n/comments?per_page=100" \
                --jq '[.[] | select(.body | test("@dependabot (recreate|rebase)")) | .created_at] | max // empty')
              if [ -n "$recent" ] && [ $(( $(date +%s) - $(date -d "$recent" +%s) )) -lt 72000 ]; then
                echo "#$n: conflicting; recent recreate/rebase command pending — waiting" | tee -a "$GITHUB_STEP_SUMMARY"
              else
                echo "#$n: conflicting — asking Dependabot to recreate" | tee -a "$GITHUB_STEP_SUMMARY"
                gh pr comment "$n" -R "$REPO" --body "@dependabot recreate"
              fi
            elif [ "$armed" = "false" ] && [ "$failing" != "true" ] && \
                 [ "$(gh api "repos/$REPO/pulls/$n/reviews" --paginate --jq '[.[] | select(.state == "APPROVED" and ((.user.login // "") | test("\\[bot\\]$") | not))] | length')" -gt 0 ]; then
              echo "#$n: human approval standing — shepherding (arm auto-merge)" | tee -a "$GITHUB_STEP_SUMMARY"
              gh pr merge --auto --squash "$(gh pr view "$n" -R "$REPO" --json url --jq .url)" \
                || { echo "::error::#$n: could not arm auto-merge"; FAILURES=$((FAILURES+1)); }
            elif { [ "$failing" = "true" ] || [ "$armed" = "false" ]; } && [ "$requested" = "false" ]; then
              echo "#$n: needs a human (failing=$failing armed=$armed) — requesting $REVIEW_TEAM review" | tee -a "$GITHUB_STEP_SUMMARY"
              GH_TOKEN="$GH_ROUTE_TOKEN" gh api -X POST "repos/$REPO/pulls/$n/requested_reviewers" \
                -f "team_reviewers[]=$REVIEW_TEAM" \
                || { echo "::error::#$n: could not request $REVIEW_TEAM review"; FAILURES=$((FAILURES+1)); }
            else
              echo "#$n: OK (armed=$armed failing=$failing team-review-requested=$requested)" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done
          if [ "$FAILURES" -gt 0 ]; then
            echo "::error::sweep completed with $FAILURES failure(s) — see log"
            echo "**Sweep completed with $FAILURES failure(s)** — investigate before trusting this repo's automation." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
